schema_version: "1.0"
estimation:
  default_selectivity: 0.5
report:
  top_n: 10
diagnostics:
  PARTITION_KEY_UNFILTERED:
    enabled: true
    severity: warning
  LOW_SELECTIVITY_PARTITION:
    enabled: true
    severity: warning
    thresholds:
      min_partition_prune_ratio: 0.5
      min_scanned_file_ratio: 0.5
      min_scanned_files: 2
  HIGH_CARDINALITY_OVERPARTITION:
    enabled: true
    severity: info
    thresholds:
      min_partition_count: 4
      min_selected_partition_ratio: 0.8
      min_selected_partitions: 2
  FUNCTION_WRAPPED_PARTITION:
    enabled: true
    severity: critical
  STATS_MISSING:
    enabled: true
    severity: warning
    thresholds:
      min_missing_filter_columns: 1
  PATH_MANIFEST_MISMATCH:
    enabled: true
    severity: critical
  OR_BRANCH_BLOWUP:
    enabled: true
    severity: warning
    thresholds:
      min_branches: 2
      min_expansion_factor: 1.5
  UNKNOWN_PREDICATE_CONSERVATIVE:
    enabled: true
    severity: warning
